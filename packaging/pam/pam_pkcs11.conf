pam_pkcs11 {
  nullok = false;
  debug = false;
  use_first_pass = false;
  try_first_pass = false;
  use_authtok = false;
  card_only = false;
  wait_for_card = false;
  use_pkcs11_module = openhello;
  pkcs11_module openhello {
    module = /usr/lib/openhello/libopenhello_pkcs11.so;
    description = "open-hello TPM token";
    slot_num = 0;
    nss_dir = /etc/openhello/nssdb;
    support_threads = false;
    ca_dir = /etc/openhello/cacerts;
    crl_dir = /etc/openhello/crls;
    cert_policy = signature;
  }
  use_mappers = subject;
  mapper_search_path = /usr/lib64/pam_pkcs11;
  mapper subject {
    debug = false;
    module = internal;
    ignorecase = false;
    mapfile = file:///etc/openhello/pkcs11-subject-map;
  }
}
