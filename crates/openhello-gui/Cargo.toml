[package]
name = "openhello-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openhello-gui"
path = "src/main.rs"

[dependencies]
openhello-gui-core = { path = "../openhello-gui-core" }
openhello-cli = { path = "../openhello-cli" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
libc = "0.2"
