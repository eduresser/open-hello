[package]
name = "openhellod"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openhello-plugin-abi.workspace = true
openhello-ticket = { path = "../openhello-ticket" }
openhello-auth-proto = { path = "../openhello-auth-proto" }
futures-lite = "2"
thiserror.workspace = true
libloading = "0.8"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
blocking = "1"
libc = "0.2"
async-io = "2"

[dev-dependencies]
engine-adapter-face = { path = "../engine-adapter-face" }
async-io = "2"
tempfile = "3"
storage-adapter-templates = { path = "../storage-adapter-templates" }
openhello-keyd = { path = "../openhello-keyd" }
