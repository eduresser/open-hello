[package]
name = "openhello-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
serde = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
openhellod = { path = "../openhellod" }

[dev-dependencies]
async-io = "2"
openhello-keyd = { path = "../openhello-keyd" }
openhello-ticket = { path = "../openhello-ticket" }
openhello-pkcs11 = { path = "../openhello-pkcs11" }
tempfile = "3"
openhello-auth-proto = { path = "../openhello-auth-proto" }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
