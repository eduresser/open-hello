[package]
name = "engine-adapter-face"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
tempfile = "3"

[features]
default = ["ort-backend"]
ort-backend = ["dep:ort"]

[dependencies]
openhello-plugin-abi.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic"], optional = true }

[[bin]]
name = "openhello-calibrate"
path = "src/bin/openhello-calibrate.rs"
required-features = ["ort-backend"]
