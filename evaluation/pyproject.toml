[project]
name = "openhello-eval"
version = "0.1.0"
description = "Offline accuracy evaluation for open-hello face recognition"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openhello_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
